[package]
name = "gpui-bridge-host"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22"
chrono = "0.4"
env_logger = "0.11.11"
futures = "0.3"
gpui-kit = "0.7"
image = { version = "0.25", default-features = false }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = { version = "0.26", default-features = false }

# The tray needs one of `tray-icon`'s two Linux backends or it does not compile (see its
# `compile_error!`). `ksni` talks D-Bus on its own, so Linux needs no GTK or libappindicator;
# Windows and macOS use the platform's own API and take no feature.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

# The release profile lives in the workspace root (`/Cargo.toml`): Cargo ignores
# `[profile.*]` in a member, and the packaged host depends on it.
