[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpui-bridge"
version = "0.1.0"
description = "Python client for the gpui-bridge native UI host"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gpui-bridge contributors" }]
keywords = ["gpui", "gpui-component", "native", "desktop", "ui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/InDIOS/gpui-bridge#readme"
Repository = "https://github.com/InDIOS/gpui-bridge"
Issues = "https://github.com/InDIOS/gpui-bridge/issues"
Protocol = "https://github.com/InDIOS/gpui-bridge/blob/main/docs/PROTOCOL.md"

[tool.setuptools]
packages = ["gpui_bridge"]

[tool.setuptools.package-data]
gpui_bridge = ["bin/*"]
