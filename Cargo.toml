[workspace]
members = ["packages/host"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"

# Distribution build (bundled into the client packages as an asset): smallest binary,
# slower to compile. It lives here because Cargo ignores `[profile.*]` in a workspace
# member, and the host is built through this workspace.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
