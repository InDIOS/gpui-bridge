name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo test --workspace
      - name: Build the host once
        run: cargo build -p gpui-bridge-host --release

      - name: Publish the clients (the host is staged by prepack / build_wheel.py)
        shell: pwsh
        run: |
          # Trusted publishing: npm authenticates via GitHub OIDC (no NODE_AUTH_TOKEN).
          # Configure trusted publishers on npmjs.org pointing at this repo/branch/workflow.
          # The platform package goes first: `gpui-bridge` pulls it in as an optional
          # dependency. This job runs on Windows and publishes the Windows host.
          # Cross-platform publication (3 platform packages + 3 wheels per release) is
          # the rest of M6 (matrix over macOS/Linux runners).
          pnpm --dir packages/host-win32-x64 publish --no-git-checks
          pnpm --dir packages/client-node pack
          pnpm --dir packages/client-node publish --no-git-checks
          pnpm --dir packages/client-react publish --no-git-checks

          node scripts/stage-host.mjs --to python
          python packages/client-python/build_wheel.py

      - name: Publish the Python wheel to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            packages/host-win32-x64/*.tgz
            packages/client-node/*.tgz
            packages/client-python/dist/*.whl
