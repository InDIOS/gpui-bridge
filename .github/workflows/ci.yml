name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep CI on the same Rust the repository is developed and verified with
  # (rust-toolchain.toml, docs/GPUI_BRIDGE_PLAN.md §3.1). Bump both together.
  RUST_VERSION: "1.99.1"

# A new push to the same branch cancels the previous run: only the newest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    # The host is Windows-only today; every job below runs on the same OS so the binary
    # that the clients test is the binary that would ship.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p gpui-bridge-host --release --locked
      - run: target/release/gpui-bridge-host.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-bridge-host-win32-x64
          path: target/release/gpui-bridge-host.exe
          if-no-files-found: error

  clients:
    needs: host
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: gpui-bridge-host-win32-x64
          # Where the clients look in a checkout.
          path: target/release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:node
      - run: pnpm test:react
      - run: pnpm test:python
      - name: Type-check the examples
        run: pnpm --filter gpui-bridge-examples typecheck

  pack:
    needs: host
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: gpui-bridge-host-win32-x64
          path: target/release
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the npm client (stages the host asset)
        run: pnpm --dir packages/client-node pack
      - name: Build the platform-tagged wheel
        run: node scripts/stage-host.mjs --to python; python packages/client-python/build_wheel.py
      - name: The tarball carries the host
        run: |
          tar -tf packages/client-node/gpui-bridge-*.tgz | Select-String 'bin/gpui-bridge-host.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packages/client-node/*.tgz
            packages/client-python/dist/*.whl
